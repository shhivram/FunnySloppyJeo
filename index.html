<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Days of Sloppy Joe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;700;800&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one column. Beer-label masthead, four-chapter strip that lights up as the night goes on, the playable stage, then the HUD. Single deliberate night look. */
:root{
  color-scheme: dark;
  --night:#1b1426;
  --night-2:#271d36;
  --night-3:#3a2c4f;
  --foam:#fff6df;
  --muted:#b9a9cf;
  --amber:#ffb627;
  --chili:#e8453c;
  --display:'Bungee', 'Impact', 'Arial Black', sans-serif;
  --body:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
}
*{box-sizing:border-box}
body{background:var(--night);color:var(--foam);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
.eyebrow{margin:0;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
h1{margin:6px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(40px,8.4vw,92px);line-height:.95;color:var(--amber);text-shadow:.05em .05em 0 var(--chili);text-wrap:balance}
h1 small{display:block;font-size:.36em;letter-spacing:.2em;color:var(--foam);text-shadow:none;margin-bottom:.15em}
.lede{margin:12px 0 0;max-width:62ch;font-size:18px;color:var(--muted)}
.lede b{color:var(--foam)}
.chapters{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chapters li{display:flex;align-items:center;gap:10px;min-width:0;background:var(--night-2);border:2px solid var(--night-3);border-radius:14px;padding:8px 12px;color:var(--muted);font-weight:700;font-size:15px;line-height:1.2;transition:all .25s}
.chapters li span{font-family:var(--display);font-size:20px;color:var(--night-3);transition:color .25s}
.chapters li.on{border-color:var(--amber);color:var(--foam);background:var(--night-3)}
.chapters li.on span{color:var(--amber)}
.chapters li.done{color:var(--foam)}
.chapters li.done span{color:var(--chili)}
.stage-box{position:relative;border-radius:18px;overflow:hidden;border:4px solid var(--foam);box-shadow:0 0 0 6px var(--amber);background:#2a2040}
canvas{display:block;width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:16px}
#hint{margin:0;flex:1 1 320px;min-width:0;font-size:19px;font-weight:800;line-height:1.35}
.meter{flex:0 1 240px;min-width:170px;display:flex;flex-direction:column;gap:4px}
.meter span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.bar{height:14px;border-radius:99px;background:var(--night-2);border:2px solid var(--night-3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber);border-radius:99px;transition:width .15s linear}
.btn{appearance:none;font:inherit;font-weight:800;cursor:pointer;border-radius:99px;padding:8px 18px;border:2px solid var(--foam);background:transparent;color:var(--foam)}
.btn:hover{background:var(--night-3)}
.btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.btn.hot{background:var(--chili);border-color:var(--chili);color:#fff}
.endcard{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(27,20,38,.74);backdrop-filter:blur(3px)}
.endcard[hidden]{display:none}
.card{width:min(540px,100%);max-height:100%;overflow:auto;background:var(--foam);color:var(--night);border-radius:16px;padding:22px 22px 18px;box-shadow:8px 8px 0 var(--chili);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7) rotate(3deg);opacity:0}}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--chili)}
.card .say{margin:8px 0 14px;font-size:16.5px;font-weight:700}
.report{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px}
.report li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;font-size:14.5px;line-height:1.35}
.report img{width:44px;height:52px;border-radius:50%;object-fit:cover}
.report b{display:block;font-size:15.5px}
.card .row{display:flex;flex-wrap:wrap;gap:10px}
.card .btn{border-color:var(--night);color:var(--night)}
.card .btn:hover{background:#f1e4c4}
.card .btn.hot{color:#fff;border-color:var(--chili)}
@media (max-width:640px){.chapters{grid-template-columns:repeat(2,1fr)}#hint{font-size:17px}.card h2{font-size:28px}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>

</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">Another completely useless website</p>
    <h1><small>A true story, roughly</small>Days of Sloppy Joe</h1>
    <p class="lede">One Friday evening. One walk to the <b>HiFi Bar</b>. Three friends, twelve rounds, and three disasters that happened at exactly the same time.</p>
  </header>

  <ol class="chapters" id="chapters" aria-label="How the night went">
    <li data-ch="walk"><span>1</span>The walk</li>
    <li data-ch="shop"><span>2</span>HiFi Bar</li>
    <li data-ch="drink"><span>3</span>Twelve rounds</li>
    <li data-ch="finale"><span>4</span>The aftermath</li>
  </ol>

  <section aria-label="Stage">
    <div class="stage-box">
      <canvas id="stage" width="960" height="600" aria-label="Interactive story scene"></canvas>
      <div class="endcard" id="endcard" hidden></div>
    </div>
    <div class="hud">
      <p id="hint" aria-live="polite"></p>
      <div class="meter"><span id="mlabel">Meter</span><div class="bar"><i id="mfill"></i></div></div>
      <button class="btn" id="sound" aria-pressed="true">Sound on</button>
      <button class="btn" id="restart">Start over</button>
    </div>
  </section>
</main>

const SFX = (() => {

  const last = {};

    nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);

  }
  const ok = () => ac && on && ac.state === 'running';

    bark() { [0, .2].forEach(d => { noise(.09, 900, .35, 'bandpass', d); tone(560, 260, .1, 'sawtooth', .18, d); }); },
    honk() { [0, .28].forEach(d => { tone(392, 392, .2, 'square', .13, d); tone(494, 494, .2, 'square', .1, d); }); },
    moo() { tone(165, 120, 1.0, 'sawtooth', .14); tone(330, 240, 1.0, 'sine', .05); },
    bonk() { tone(520, 110, .4, 'triangle', .35); tone(150, 55, .22, 'square', .2); noise(.05, 3000, .3, 'highpass'); },
    airhorn() { [0, .22, .44].forEach((d, i) => { tone(415, 415, i === 2 ? .5 : .16, 'sawtooth', .13, d); tone(523, 523, i === 2 ? .5 : .16, 'sawtooth', .1, d); }); },

    clonk() { tone(240, 90, .3, 'triangle', .3); tone(700, 400, .15, 'square', .06); },
    crash() { noise(1.1, 3200, .5, 'lowpass', 0, 180); tone(950, 620, .55, 'square', .07); tone(1350, 1000, .45, 'square', .05, .06); tone(120, 40, .35, 'sine', .4); },

/* ---------- update ---------- */

  if (s.shiv.party > 0) s.shiv.party -= dt;
  if (s.shiv.siu >= 0) { s.shiv.siu += dt; if (s.shiv.siu > 3.2 || s.shiv.moving) s.shiv.siu = -1; }
  if (s.phase === 'walk') updateWalk(dt);
  else if (s.phase === 'shop') { s.cam = lerp(s.cam, 2140, dt * 3); s.night = Math.min(1, s.night + dt * .2); }
  else if (s.phase === 'drink') {
    s.cam = lerp(s.cam, 2140, dt * 3); s.cheerT = Math.max(0, s.cheerT - dt); s.night = Math.min(1, s.night + dt * .2);
    if (s.drunk > 0 && Math.random() < dt * s.drunk * 1.6) { const who = pick([2560, 2630, 2700]); pop('HIC!', who - s.cam + (Math.random() - .5) * 30, GY - 210, { snd: 'hic', size: 20, color: '#c9b6ef', dur: .9 }); }
    if (s.round >= 12 && Math.random() < dt * 1.5) zzz(pick([2560, 2630, 2700]) + 20, GY - 190);
  } else if (s.phase === 'banner') { if (s.pt > 2.4) { s.phase = 'finale'; s.ft = 0; s.fev = {}; parts = []; pops = []; talk = []; s.cam = 0; chapter('finale'); setHint('Same time, three different disasters.'); } }

}
function updateWalk(dt) {

  // arrive

  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(-14, -34); ctx.lineTo(22, -34); ctx.lineTo(36, 0); ctx.lineTo(10, -6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#222'; rr(-26, -44, 40, 10, 4); ctx.fill();
  ctx.strokeStyle = '#444'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(22, -34); ctx.lineTo(28, -56); ctx.lineTo(16, -60); ctx.stroke();
  ctx.fillStyle = '#ffef9a'; circle(32, -42, 5); ctx.fill();
  ctx.restore();
}
function drawFinale() {
  const s = state, ft = s.ft, t = s.t, sc = .82, F = FEET * sc;
  // PANEL 1: Shiv on the bike
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, PW, H); ctx.clip();
  panelBg(0);
  const crashed = ft >= 3, bent = crashed ? -.4 : 0;
  ctx.save(); ctx.translate(262, GY); ctx.rotate(bent);
  ctx.fillStyle = '#5f6170'; ctx.fillRect(-5, -270, 10, 270); ctx.fillRect(-5, -270, -46, 8);
  ctx.fillStyle = 'rgba(255,230,140,.18)'; ctx.beginPath(); ctx.moveTo(-46, -262); ctx.lineTo(-110, 0); ctx.lineTo(20, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff2b0'; circle(-46, -258, 7); ctx.fill(); ctx.restore();
  let bx, by = GY - 22, brot = 0, shivO;
  if (!crashed) {
    bx = lerp(-60, 210, ease(ft / 3) * .3 + ft / 3 * .7); const wob = Math.sin(ft * 7) * .12;
    brot = wob;
    drawBike(bx, by, brot, .9);
    shivO = { x: bx - 6, headY: by - 50 - 71 * sc, s: sc, sit: true, knee: 6, foot: 2, armL: -.15, armR: -.25, rosy: 1, sway: wob };
    drawPerson(DEF.shiv, shivO); head('shiv', shivO.x, shivO.headY - 34, 0, PW);
  } else {
    const e = clamp((ft - 3) / .9, 0, 1);
    drawBike(lerp(212, 228, e), GY - 14 - Math.sin(e * Math.PI) * 30, lerp(0, 2.6, e), .9);
    const sx = lerp(205, 130, e), sy = lerp(GY - 120, GY - 22, e) - Math.sin(e * Math.PI) * 120;
    drawPerson(DEF.shiv, { x: sx, headY: sy, s: sc, lie: e < 1 ? e * 5 : -Math.PI / 2, rosy: 1, bandage: ft > 4.2 }); head('shiv', sx, sy - 30, 0, PW);
    if (ft > 4.2 && Math.random() < .02) star(sx - 4, sy - 30, 1);
  }
  panelLabel(0, 'SHIV');
  ctx.restore();

  // PANEL 2: Manny gets kicked out
  ctx.save(); ctx.translate(PW, 0); ctx.beginPath(); ctx.rect(0, 0, PW, H); ctx.clip();
  panelBg(1);
  ctx.fillStyle = '#e98a6a'; ctx.fillRect(160, GY - 260, 170, 260); ctx.fillStyle = '#e9e1cf'; ctx.fillRect(152, GY - 270, 180, 14);
  ctx.fillStyle = '#ffd77a'; ctx.fillRect(275, GY - 220, 34, 40);
  const open = ft >= 3.4 && ft < 5.0, dX = 215, dW = 58, dH = 128;
  ctx.fillStyle = open ? '#ffe9a8' : '#3a2416'; ctx.fillRect(dX, GY - dH, dW, dH);
  if (open) { ctx.fillStyle = 'rgba(255,233,168,.25)'; ctx.beginPath(); ctx.moveTo(dX, GY); ctx.lineTo(dX - 120, GY + 60); ctx.lineTo(dX + 30, GY + 60); ctx.lineTo(dX + dW, GY); ctx.fill(); ctx.fillStyle = '#6b3f22'; ctx.fillRect(dX + dW - 10, GY - dH, 10, dH); }
  else { ctx.fillStyle = '#6b3f22'; ctx.fillRect(dX + 4, GY - dH + 4, dW - 8, dH - 4); ctx.fillStyle = '#ffb627'; circle(dX + dW - 14, GY - 64, 4); ctx.fill(); }
  // the kick
  if (ft >= 3.55 && ft < 4.3) {
    const e = ease((ft - 3.55) / .15) * (1 - ease((ft - 4.05) / .25));
    const lx = dX + 30 - e * 70, ly = GY - 62;
    ctx.strokeStyle = '#8a5a3c'; ctx.lineWidth = 16; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(dX + 40, ly - 4); ctx.lineTo(lx, ly); ctx.stroke();
    ctx.strokeStyle = '#ffd25e'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(lx + 12, ly, 9, 0, 7); ctx.stroke();
    ctx.fillStyle = '#c0392b'; rr(lx - 16, ly - 9, 14, 20, 5); ctx.fill();
    ctx.strokeStyle = '#2e7d4f'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(dX + 46, ly - 14); ctx.lineTo(dX + 46, ly + 10); ctx.stroke();
  }
  let mO;
  if (ft < 2.4) mO = { x: lerp(-30, 190, ft / 2.4), headY: GY - F, s: sc, walk: ft * 9, rosy: 1, sway: Math.sin(ft * 3) * .12 };
  else if (ft < 3.7) mO = { x: 190, headY: GY - F, s: sc, armR: ft < 3.1 ? -1.0 + Math.sin(ft * 18) * .4 : -.7, armL: ft >= 3.1 ? -2.45 : undefined, rosy: 1, sway: Math.sin(ft * 3) * .08 };
  else if (ft < 4.6) { const e = (ft - 3.7) / .9; mO = { x: lerp(190, 60, e), headY: lerp(GY - F, GY - 24, e) - Math.sin(e * Math.PI) * 190, s: sc, spin: -e * 9, armL: -2.4, armR: -.8, rosy: 1 }; }
  else mO = { x: 60, headY: GY - 24, s: sc, lie: -Math.PI / 2, rosy: 1, armL: -2.6 };
  drawPerson(DEF.manny, mO); head('manny', PW + mO.x, mO.headY - 34, PW, PW * 2);
  if (ft >= 5.0 && ft < 5.6) { const e = (ft - 5.0) / .6; ctx.save(); ctx.translate(lerp(dX, 64, e), lerp(GY - 60, GY - 60, e) - Math.sin(e * Math.PI) * 120); ctx.rotate(e * 14); ctx.fillStyle = '#c0392b'; rr(-14, -8, 28, 16, 6); ctx.fill(); ctx.restore(); }
  if (ft >= 5.6) { ctx.fillStyle = '#c0392b'; rr(54, GY - 70, 28, 14, 6); ctx.fill(); }
  if (ft >= 6.4) { const e = clamp((ft - 6.4) / .4, 0, 1); ctx.fillStyle = '#f2f4ff'; rr(lerp(dX, 20, e), lerp(GY - 80, GY - 18, e) - Math.sin(e * Math.PI) * 90, 46, 22, 9); ctx.fill(); }
  panelLabel(1, 'MANNY');
  ctx.restore();

  // PANEL 3: Power, unbothered
  ctx.save(); ctx.translate(PW * 2, 0); ctx.beginPath(); ctx.rect(0, 0, PW, H); ctx.clip();
  panelBg(2);
  ctx.fillStyle = '#f6f0d8'; circle(250, 120, 34); ctx.fill(); ctx.fillStyle = '#24304f'; circle(236, 112, 30); ctx.fill();
  ctx.fillStyle = '#8e8a9a'; ctx.fillRect(0, GY - 70, PW, 70); ctx.fillStyle = '#a7a2b4'; ctx.fillRect(0, GY - 76, PW, 10);
  ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 2; for (let y = GY - 52; y < GY; y += 18) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(PW, y); ctx.stroke(); }
  const lit = ft >= 1.0, toMouth = lit && (ft % 2.6) < 1.0;
  const pO = { x: 170, headY: GY - 76 - 89 * sc, s: sc, sit: true, dir: -1, armR: toMouth ? -2.05 : DOWN_R - .5, armL: DOWN_L - .3, joint: lit, rosy: .7, sway: Math.sin(t * .8) * .03 };
  drawPerson(DEF.power, pO); head('power', PW * 2 + pO.x, pO.headY - 34, PW * 2, W);
  if (lit && toMouth && Math.random() < .03) { const [hx, hy] = hand(pO, 'R'); bubble(hx - 10, hy - 12); }
  panelLabel(2, 'POWER');
  ctx.restore();

  // dividers
  ctx.fillStyle = '#fff6df'; ctx.fillRect(PW - 3, 0, 6, H); ctx.fillRect(PW * 2 - 3, 0, 6, H);
  drawParts(); drawPops(); drawTalk();
}

/* ---------- end card ---------- */
function showEnd() {
  chapter('end'); SFX.wah();
  setHint('The night is over. Nobody learned anything.');
  endEl.innerHTML = `<div class="card" role="dialog" aria-label="Damage report"><h2>Damage report</h2>
    <p class="say">Twelve rounds. Three friends. Three disasters, all at 11:47 PM.</p>
    <ul class="report">
      <li><img src="${FACE_SRC.shiv}" alt=""><span><b>Shiv · Bike: totaled</b>Friday full ah: achieved. Headphones: survived. Bike and lamp post: both totaled. Should have taken that auto.</span></li>
      <li><img src="${FACE_SRC.manny}" alt=""><span><b>Manny · Sleeping outside tonight</b>Called his wife “pretty mama”. Score: slipper 1, pretty man 0. At least he got a pillow.</span></li>
      <li><img src="${FACE_SRC.power}" alt=""><span><b>Power · Completely unbothered</b>Said “Vaanga thozhar” once. Noticed nothing after that. Still on that wall.</span></li>
    </ul>
    <div class="row"><button class="btn hot" data-go="finale">Watch the aftermath again</button><button class="btn" data-go="start">Start the day over</button></div></div>`;
  endEl.hidden = false; endEl.querySelector('.btn.hot').focus({ preventScroll: true });
}
endEl.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  if (b.dataset.go === 'start') reset();
  else { endEl.hidden = true; Object.assign(state, { phase: 'finale', ft: 0, fev: {} }); parts = []; pops = []; talk = []; chapter('finale'); setHint('Same time, three different disasters.'); }
});

/* ---------- loop ---------- */
document.getElementById('restart').onclick = reset;
const sndBtn = document.getElementById('sound');
function sndLabel() { sndBtn.textContent = SFX.on ? 'Sound on' : 'Sound off'; sndBtn.setAttribute('aria-pressed', SFX.on); }
sndBtn.onclick = () => { SFX.init(); SFX.toggle(); sndLabel(); }; sndLabel();

reset();
let last = performance.now();
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000); last = ts; now += dt; frameNo++;
  update(dt); stepParts(dt); stepPops(dt); shake = Math.max(0, shake - dt * 30);
  ctx.setTransform(k, 0, 0, k, 0, 0);
  if (shake) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  const s = state;
  if (s.phase === 'banner') drawBanner();
  else if (s.phase === 'finale' || s.phase === 'end') drawFinale();
  else {
    const dr = s.drunk;
    if (dr > 0 && !reduce) { ctx.translate(480, 300); ctx.rotate(Math.sin(s.t * 1.1) * .012 * dr); ctx.translate(-480, -300); }
    drawWalkWorld();
    if (dr > .2 && !reduce) { ctx.save(); ctx.globalAlpha = .12 * dr; ctx.translate(10 * dr * Math.sin(s.t * 1.7), 3 * dr); drawWalkWorld(); ctx.restore(); }
    drawPops(); drawTalk();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
